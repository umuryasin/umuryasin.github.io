<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umur Y. Alper — Geliştirici</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #fff;
      color: #1a1a1a;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 80px 24px 60px;
    }

    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .header p { font-size: 15px; color: #666; }

    .section-label {
      font-size: 12px;
      text-transform: uppercase;
      color: #999;
      margin: 32px 0 16px;
    }

    .app-card {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .app-card h3 { font-size: 17px; margin-bottom: 6px; }
    .app-card p { font-size: 14px; color: #666; }

    .store-links {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .store-link {
      padding: 8px 12px;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      color: #000;
    }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Umur Y. Alper</h1>
    <p>Mobil uygulama ve oyun geliştirici</p>
  </div>

  <!-- GAMES -->
  <div class="section-label">Games</div>

  <div class="app-card">
    <h3>Sand Boom</h3>
    <p>Physics-based sand puzzle game.</p>

    <div class="store-links">
      <a href="#" class="store-link">Google Play (yakında)</a>
    </div>
  </div>

  <!-- APPS -->
  <div class="section-label">Apps</div>

  <div class="app-card">
    <h3>Plaka Kontrol TR</h3>
    <p>Türk plakalarını analiz eden mobil uygulama.</p>

    <div class="store-links">
      <a href="https://play.google.com/store/apps/details?id=com.plaka.plate_scanner" class="store-link" target="_blank">
        Google Play
      </a>
    </div>
  </div>

  <div class="footer">© 2026 Umur Y. Alper</div>

</div>

</body>
</html>
